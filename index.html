<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Esconde-Bicho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  /* Tema único e claro de propósito: um jardim de desenho animado */
  :root {
    color-scheme: light;
    --ceu: #dff4ff;
    --ceu2: #bfe8ff;
    --grama: #7bd389;
    --grama-escura: #3fa35a;
    --tinta: #2d2a4a;
    --papel: #ffffff;
    --suave: #6b6890;
    --certo: #2fbf71;
    --quase: #ffc233;
    --nao: #c9c6dc;
    --destaque: #ff6b9a;
  }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(var(--ceu2), var(--ceu) 260px);
    color: var(--tinta);
    font: 500 17px/1.35 "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    padding-inline: 16px;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 540px;
    padding-block: 16px 32px;
    display: flex; flex-direction: column; gap: 14px;
  }
  button { font: inherit; color: inherit; }

  /* Estilo "adesivo": contorno grosso e sombra dura */
  .adesivo {
    background: var(--papel);
    border: 3px solid var(--tinta);
    border-radius: 18px;
    box-shadow: 4px 4px 0 var(--tinta);
  }

  /* ---------- Topo ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  h1 {
    margin: 0;
    font-weight: 800; font-size: 34px; line-height: 1;
    letter-spacing: -.01em;
    color: var(--destaque);
    -webkit-text-stroke: 1.5px var(--tinta);
    text-shadow: 3px 3px 0 var(--tinta);
  }
  .topo-botoes { display: flex; gap: 8px; }
  .chip {
    border: 3px solid var(--tinta);
    border-radius: 999px;
    background: var(--papel);
    padding: 2px 14px;
    font-weight: 700; font-size: 15px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--tinta);
  }
  .chip[aria-pressed="true"] { background: var(--quase); }
  .chip:active { transform: translate(2px, 2px); box-shadow: none; }

  .modos { display: flex; gap: 8px; flex-wrap: wrap; }
  .modos .chip { flex: 1 1 0; min-height: 40px; }
  .modos small { display: block; font-weight: 500; font-size: 12px; line-height: 1.1; color: var(--suave); }
  .modos .chip[aria-pressed="true"] small { color: var(--tinta); }

  /* ---------- Jardim com o segredo ---------- */
  .jardim {
    position: relative;
    background: var(--grama);
    padding: 14px 12px 12px;
    overflow: hidden;
  }
  .jardim::before {
    content: ""; position: absolute; inset: auto 0 0 0; height: 30%;
    background: var(--grama-escura); opacity: .35;
  }
  .fala {
    position: relative; z-index: 1;
    background: var(--papel);
    border: 3px solid var(--tinta);
    border-radius: 14px;
    padding: 6px 12px;
    font-weight: 700;
    margin: 0 0 12px;
    min-height: 1.35em;
  }
  .fala::after {
    content: ""; position: absolute; left: 28px; bottom: -11px;
    width: 14px; height: 14px; background: var(--papel);
    border-right: 3px solid var(--tinta); border-bottom: 3px solid var(--tinta);
    transform: rotate(45deg);
  }
  .esconderijos {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .esconderijo {
    position: relative;
    aspect-ratio: 1; max-width: 100%;
    display: grid; place-items: center;
  }
  .esconderijo .bicho-svg { width: 78%; transform: translateY(40%) scale(.6); opacity: 0; transition: transform .45s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
  .esconderijo .arbusto { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .5s ease-in; }
  .esconderijo.revelado .arbusto { transform: translateY(85%); }
  .esconderijo.revelado .bicho-svg { transform: none; opacity: 1; }
  .esconderijo:not(.revelado) .arbusto { animation: balanca 3s ease-in-out infinite; transform-origin: 50% 100%; }
  .esconderijo:nth-child(2) .arbusto { animation-delay: -.7s; }
  .esconderijo:nth-child(3) .arbusto { animation-delay: -1.4s; }
  .esconderijo:nth-child(4) .arbusto { animation-delay: -2.1s; }
  @keyframes balanca { 50% { transform: rotate(-3deg); } }

  /* ---------- Palpite atual ---------- */
  .jogada { padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
  .linha-titulo { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .linha-titulo h2 { margin: 0; font-size: 19px; font-weight: 800; }
  .vidas { display: flex; gap: 4px; flex-wrap: wrap; }
  .vida { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tinta); background: var(--destaque); }
  .vida.gasta { background: transparent; opacity: .35; }

  .casas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .casa {
    aspect-ratio: 1; max-width: 100%;
    border: 3px dashed var(--suave);
    border-radius: 16px;
    background: #f4f2ff;
    display: grid; place-items: center;
    cursor: pointer; padding: 0;
    position: relative;
  }
  .casa.cheia { border-style: solid; border-color: var(--tinta); background: var(--papel); }
  .casa.proxima { border-color: var(--destaque); background: #fff0f5; }
  .casa .bicho-svg { width: 80%; animation: pula .3s cubic-bezier(.3,1.8,.5,1); }
  .casa .num { font-weight: 800; font-size: 22px; color: var(--suave); opacity: .6; }
  @keyframes pula { from { transform: scale(.3); } }

  .paleta { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .paleta.quatro { grid-template-columns: repeat(4, 1fr); }
  .peca {
    border: 3px solid var(--tinta);
    border-radius: 16px;
    background: var(--papel);
    padding: 4px 2px 2px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 3px 3px 0 var(--tinta);
    transition: transform .08s;
    min-width: 0;
  }
  .peca .bicho-svg { width: 100%; max-width: 58px; }
  .peca span { font-size: 12px; font-weight: 700; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .peca:hover:not(:disabled) { transform: translateY(-3px); }
  .peca:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
  .peca:disabled { opacity: .3; cursor: default; box-shadow: none; }

  .acoes { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .btn {
    min-height: 52px;
    border: 3px solid var(--tinta);
    border-radius: 16px;
    font-weight: 800; font-size: 19px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--tinta);
    background: var(--papel);
  }
  .btn.testar { background: var(--certo); color: #fff; -webkit-text-stroke: .5px var(--tinta); }
  .btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: none; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.novo { background: var(--quase); }

  button:focus-visible { outline: 4px solid var(--destaque); outline-offset: 3px; }

  /* ---------- Legenda e histórico ---------- */
  .legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--suave); font-weight: 700; }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }

  .marca {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--tinta);
    display: inline-grid; place-items: center;
    font-size: 13px; font-weight: 800; line-height: 1;
    flex: none;
  }
  .marca.certo { background: var(--certo); color: #fff; }
  .marca.quase { background: var(--quase); }
  .marca.nao { background: var(--nao); color: var(--suave); }

  .historico { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .historico h2 { margin: 0; font-size: 17px; font-weight: 800; }
  .historico .vazio { margin: 0; color: var(--suave); font-size: 15px; }
  .tentativa {
    display: grid;
    grid-template-columns: 28px repeat(4, 1fr) auto;
    align-items: center; gap: 8px;
    padding: 6px 8px;
    border-radius: 12px;
    background: #f7f6ff;
    animation: entra .35s ease-out;
  }
  .tentativa.posicao { grid-template-columns: 28px repeat(4, 1fr); }
  .tentativa .n { font-weight: 800; color: var(--suave); text-align: center; }
  .mini { position: relative; display: grid; place-items: center; }
  .mini .bicho-svg { width: 100%; max-width: 46px; }
  .mini .marca { position: absolute; right: 0; bottom: -2px; width: 20px; height: 20px; font-size: 12px; }
  .resumo { display: flex; flex-wrap: wrap; gap: 3px; max-width: 76px; justify-content: flex-end; }
  @keyframes entra { from { transform: translateY(-8px); opacity: 0; } }

  /* ---------- Fim de jogo ---------- */
  .fim {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: rgba(45,42,74,.45);
    padding: 16px;
  }
  .fim .adesivo { padding: 20px; text-align: center; max-width: 360px; width: 100%; animation: pula .4s cubic-bezier(.3,1.6,.5,1); }
  .fim h2 { margin: 0; font-size: 30px; font-weight: 800; color: var(--destaque); line-height: 1.1; }
  .fim p { margin: 6px 0 14px; }
  .estrelas { font-size: 44px; letter-spacing: 6px; line-height: 1; margin-top: 6px; }
  .estrelas .on { color: var(--quase); -webkit-text-stroke: 2px var(--tinta); }
  .estrelas .off { color: #e6e4f2; -webkit-text-stroke: 2px #c9c6dc; }
  .fim .btn { width: 100%; }

  #confete { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }

  @media (max-width: 420px) {
    h1 { font-size: 28px; }
    .paleta { gap: 6px; }
    .peca span { font-size: 11px; letter-spacing: -.02em; }
    .peca { padding-inline: 0; }
    .casas { gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; }
  }
</style>

<div class="app">
  <header>
    <h1>Esconde-Bicho</h1>
    <div class="topo-botoes">
      <button class="chip" id="som" aria-pressed="true">Som: ligado</button>
    </div>
  </header>

  <div class="modos" role="group" aria-label="Dificuldade">
    <button class="chip" data-modo="facil">Fácil<small>4 bichinhos</small></button>
    <button class="chip" data-modo="normal">Normal<small>6 bichinhos</small></button>
    <button class="chip" data-modo="desafio">Desafio<small>dicas secretas</small></button>
  </div>

  <section class="jardim adesivo" aria-label="Esconderijos">
    <p class="fala" id="fala" aria-live="polite"></p>
    <div class="esconderijos" id="esconderijos"></div>
  </section>

  <section class="jogada adesivo">
    <div class="linha-titulo">
      <h2>Quem está em cada arbusto?</h2>
      <div class="vidas" id="vidas" aria-label="Tentativas"></div>
    </div>
    <div class="casas" id="casas"></div>
    <div class="paleta" id="paleta"></div>
    <div class="acoes">
      <button class="btn" id="apagar">Apagar</button>
      <button class="btn testar" id="testar">Testar!</button>
    </div>
    <div class="legenda" id="legenda"></div>
  </section>

  <section class="historico adesivo" aria-label="Tentativas anteriores">
    <h2>Minhas tentativas</h2>
    <div id="lista"></div>
  </section>
</div>

<canvas id="confete" aria-hidden="true"></canvas>

<script>
/* =========================================================
   ESCONDE-BICHO — o jogo da Senha (Mastermind) para crianças
   HTML + CSS + JavaScript puro, sem bibliotecas.
   ========================================================= */

/* ---------- Os bichinhos ----------
   Cada um tem cor E formato diferentes, para quem não enxerga bem as cores. */
const BICHOS = [
  { nome: "Bolota",     cor: "#ff5a5f", forma: "circulo" },
  { nome: "Tijolo",     cor: "#3b82f6", forma: "quadrado" },
  { nome: "Pontudo",    cor: "#ffc93c", forma: "triangulo" },
  { nome: "Estrela", cor: "#3ccf7a", forma: "estrela" },
  { nome: "Fofura",     cor: "#9b5de5", forma: "coracao" },
  { nome: "Gota",       cor: "#ff8c42", forma: "gota" },
];

const MODOS = {
  facil:   { bichos: 4, tentativas: 10, repete: false, dicaNoLugar: true },
  normal:  { bichos: 6, tentativas: 10, repete: false, dicaNoLugar: true },
  desafio: { bichos: 6, tentativas: 10, repete: true,  dicaNoLugar: false },
};

/* ---------- Desenho dos bichinhos em SVG ---------- */
function pontosEstrela(cx, cy, rFora, rDentro) {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? rDentro : rFora;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    p.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1));
  }
  return p.join(" ");
}

function desenharBicho(i, humor = "feliz") {
  const b = BICHOS[i];
  const contorno = `stroke="#2d2a4a" stroke-width="5" stroke-linejoin="round"`;
  let corpo, olhoY, escala = 1;
  switch (b.forma) {
    case "circulo":   corpo = `<circle cx="50" cy="54" r="40" fill="${b.cor}" ${contorno}/>`; olhoY = 50; break;
    case "quadrado":  corpo = `<rect x="12" y="16" width="76" height="76" rx="18" fill="${b.cor}" ${contorno}/>`; olhoY = 48; break;
    case "triangulo": corpo = `<path d="M50 8 L92 86 Q95 94 86 94 H14 Q5 94 8 86 Z" fill="${b.cor}" ${contorno}/>`; olhoY = 66; escala = .85; break;
    case "estrela":   corpo = `<polygon points="${pontosEstrela(50, 56, 47, 24)}" fill="${b.cor}" ${contorno}/>`; olhoY = 54; escala = .8; break;
    case "coracao":   corpo = `<path d="M50 90 C20 70 6 52 10 34 C14 14 38 10 50 30 C62 10 86 14 90 34 C94 52 80 70 50 90Z" fill="${b.cor}" ${contorno}/>`; olhoY = 44; break;
    case "gota":      corpo = `<path d="M50 6 C68 34 88 50 88 66 A38 30 0 0 1 12 66 C12 50 32 34 50 6Z" fill="${b.cor}" ${contorno}/>`; olhoY = 64; escala = .9; break;
  }
  const dx = 12 * escala, rO = 8.5 * escala, rP = 4.2 * escala;
  const boca = humor === "triste"
    ? `<path d="M${50 - 8 * escala} ${olhoY + 17 * escala} Q50 ${olhoY + 10 * escala} ${50 + 8 * escala} ${olhoY + 17 * escala}" fill="none" stroke="#2d2a4a" stroke-width="4" stroke-linecap="round"/>`
    : `<path d="M${50 - 9 * escala} ${olhoY + 11 * escala} Q50 ${olhoY + 21 * escala} ${50 + 9 * escala} ${olhoY + 11 * escala}" fill="none" stroke="#2d2a4a" stroke-width="4" stroke-linecap="round"/>`;
  const olhos = [50 - dx, 50 + dx].map(x =>
    `<circle cx="${x}" cy="${olhoY}" r="${rO}" fill="#fff" stroke="#2d2a4a" stroke-width="2.5"/>` +
    `<circle cx="${x + 1.5}" cy="${olhoY + 1}" r="${rP}" fill="#2d2a4a"/>`).join("");
  const bochechas = `<circle cx="${50 - dx * 1.9}" cy="${olhoY + 10 * escala}" r="${5 * escala}" fill="#fff" opacity=".35"/><circle cx="${50 + dx * 1.9}" cy="${olhoY + 10 * escala}" r="${5 * escala}" fill="#fff" opacity=".35"/>`;
  return `<svg class="bicho-svg" viewBox="0 0 100 100" aria-hidden="true">${corpo}${bochechas}${olhos}${boca}</svg>`;
}

const ARBUSTO = `<svg class="arbusto" viewBox="0 0 100 100" aria-hidden="true">
  <g stroke="#2d2a4a" stroke-width="4" fill="#3fa35a">
    <circle cx="28" cy="62" r="24"/><circle cx="72" cy="62" r="24"/><circle cx="50" cy="44" r="28"/>
    <rect x="8" y="62" width="84" height="34" rx="14"/>
  </g>
  <g fill="#5cc377"><circle cx="40" cy="36" r="7"/><circle cx="66" cy="54" r="5"/><circle cx="24" cy="66" r="5"/></g>
  <text x="50" y="80" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="30" fill="#fff" stroke="#2d2a4a" stroke-width="1.5">?</text>
</svg>`;

/* ---------- Sons (Web Audio, sem arquivos) ---------- */
let audio = null, somLigado = true;
function tocar(notas, tipo = "triangle", dur = 0.12) {
  if (!somLigado) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    let t = audio.currentTime;
    for (const f of notas) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = tipo; o.frequency.value = f;
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur);
      t += dur * 0.8;
    }
  } catch {}
}
const SONS = {
  por:    i => tocar([392 + i * 60]),
  tirar:  () => tocar([300, 220], "sine", .08),
  testar: () => tocar([520, 660], "square", .07),
  ganhar: () => tocar([523, 659, 784, 1047, 784, 1047], "triangle", .14),
  perder: () => tocar([392, 330, 262], "sine", .22),
};

/* ---------- Estado do jogo ---------- */
const $ = id => document.getElementById(id);
let modo = "facil";
let jogo;

function sortear(qtdBichos, repete) {
  const segredo = [];
  const disponiveis = [...Array(qtdBichos).keys()];
  while (segredo.length < 4) {
    const k = Math.floor(Math.random() * disponiveis.length);
    segredo.push(disponiveis[k]);
    if (!repete) disponiveis.splice(k, 1);
  }
  return segredo;
}

function novoJogo(novoModo = modo) {
  modo = novoModo;
  try { localStorage.setItem("escondeBichoModo", modo); } catch {}
  const cfg = MODOS[modo];
  jogo = { cfg, segredo: sortear(cfg.bichos, cfg.repete), palpite: [], historico: [], fim: false };
  document.querySelectorAll(".modos .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.modo === modo));
  $("lista").innerHTML = `<p class="vazio">Escolha 4 bichinhos e aperte <b>Testar!</b></p>`;
  document.querySelector(".fim")?.remove();
  montarEsconderijos();
  montarPaleta();
  montarLegenda();
  falar(cfg.repete
    ? "Modo desafio! Pode ter bichinho repetido, e as dicas não dizem qual é qual."
    : "Os bichinhos se esconderam nos arbustos! Descubra quem está em cada um.");
  desenhar();
}

/* ---------- A lógica principal: comparar o palpite com o segredo ----------
   Primeiro marca quem está no lugar certo.
   Depois, para os outros, vê se aquele bichinho existe em outro arbusto.
   A contagem evita marcar "quase" duas vezes para o mesmo bichinho. */
function comparar(palpite, segredo) {
  const marcas = Array(4).fill("nao");
  const sobra = {};
  for (let i = 0; i < 4; i++) {
    if (palpite[i] === segredo[i]) marcas[i] = "certo";
    else sobra[segredo[i]] = (sobra[segredo[i]] || 0) + 1;
  }
  for (let i = 0; i < 4; i++) {
    if (marcas[i] === "certo") continue;
    if (sobra[palpite[i]] > 0) { marcas[i] = "quase"; sobra[palpite[i]]--; }
  }
  return marcas;
}

/* ---------- Ações ---------- */
function colocar(i) {
  if (jogo.fim || jogo.palpite.length >= 4) return;
  if (!jogo.cfg.repete && jogo.palpite.includes(i)) return;
  jogo.palpite.push(i);
  SONS.por(jogo.palpite.length);
  desenhar();
}

function tirar(pos) {
  if (jogo.fim || pos >= jogo.palpite.length) return;
  jogo.palpite.splice(pos, 1);
  SONS.tirar();
  desenhar();
}

function testar() {
  if (jogo.fim || jogo.palpite.length < 4) return;
  const marcas = comparar(jogo.palpite, jogo.segredo);
  jogo.historico.unshift({ palpite: [...jogo.palpite], marcas });
  jogo.palpite = [];
  SONS.testar();

  const certos = marcas.filter(m => m === "certo").length;
  const quases = marcas.filter(m => m === "quase").length;

  if (certos === 4) return ganhar();
  if (jogo.historico.length >= jogo.cfg.tentativas) return perder();

  falar(mensagem(certos, quases));
  desenhar();
}

function mensagem(certos, quases) {
  if (certos === 0 && quases === 0) return "Nenhum desses está escondido aqui! Tente outros bichinhos.";
  const partes = [];
  if (certos) partes.push(`${certos} no lugar certinho`);
  if (quases) partes.push(`${quases} ${quases === 1 ? "está" : "estão"} aqui, mas em outro arbusto`);
  const animo = certos === 3 ? "Quase lá!" : certos + quases === 4 ? "Todos certos, só falta trocar de lugar!" : "Muito bem!";
  return `${animo} ${partes.join(" e ")}.`;
}

function falar(texto) { $("fala").textContent = texto; }

/* ---------- Desenho da tela ---------- */
function montarEsconderijos() {
  $("esconderijos").innerHTML = jogo.segredo.map(i =>
    `<div class="esconderijo">${desenharBicho(i)}${ARBUSTO}</div>`).join("");
}

function revelar() {
  document.querySelectorAll(".esconderijo").forEach((el, k) =>
    setTimeout(() => el.classList.add("revelado"), k * 180));
}

function montarPaleta() {
  const qtd = jogo.cfg.bichos;
  $("paleta").className = "paleta" + (qtd === 4 ? " quatro" : "");
  $("paleta").innerHTML = BICHOS.slice(0, qtd).map((b, i) =>
    `<button class="peca" data-i="${i}" aria-label="${b.nome}">${desenharBicho(i)}<span>${b.nome}</span></button>`).join("");
  $("paleta").querySelectorAll(".peca").forEach(btn => btn.onclick = () => colocar(+btn.dataset.i));
}

function montarLegenda() {
  $("legenda").innerHTML = `
    <span><i class="marca certo">✓</i> lugar certinho</span>
    <span><i class="marca quase">↔</i> está em outro arbusto</span>
    ${jogo.cfg.dicaNoLugar ? `<span><i class="marca nao">✕</i> não está escondido</span>` : ""}`;
}

function desenhar() {
  // Casas do palpite atual
  $("casas").innerHTML = [0, 1, 2, 3].map(k => {
    const i = jogo.palpite[k];
    if (i === undefined) {
      const proxima = k === jogo.palpite.length ? " proxima" : "";
      return `<button class="casa${proxima}" aria-label="Arbusto ${k + 1}, vazio"><span class="num">${k + 1}</span></button>`;
    }
    return `<button class="casa cheia" data-k="${k}" aria-label="Arbusto ${k + 1}: ${BICHOS[i].nome}. Toque para tirar">${desenharBicho(i)}</button>`;
  }).join("");
  $("casas").querySelectorAll(".casa.cheia").forEach(el => el.onclick = () => tirar(+el.dataset.k));

  // Bichinhos já usados ficam apagados (quando não pode repetir)
  $("paleta").querySelectorAll(".peca").forEach(btn => {
    const i = +btn.dataset.i;
    btn.disabled = jogo.fim || jogo.palpite.length >= 4 || (!jogo.cfg.repete && jogo.palpite.includes(i));
  });

  $("testar").disabled = jogo.fim || jogo.palpite.length < 4;
  $("apagar").disabled = jogo.fim || jogo.palpite.length === 0;

  // Bolinhas de tentativas
  const usadas = jogo.historico.length;
  $("vidas").innerHTML = Array.from({ length: jogo.cfg.tentativas }, (_, k) =>
    `<i class="vida${k < usadas ? " gasta" : ""}"></i>`).join("");
  $("vidas").setAttribute("aria-label", `Restam ${jogo.cfg.tentativas - usadas} tentativas`);

  // Histórico
  if (jogo.historico.length) {
    const total = jogo.historico.length;
    $("lista").innerHTML = jogo.historico.map((t, idx) => {
      const numero = total - idx;
      const simbolo = { certo: "✓", quase: "↔", nao: "✕" };
      if (jogo.cfg.dicaNoLugar) {
        return `<div class="tentativa posicao"><span class="n">${numero}</span>${t.palpite.map((i, k) =>
          `<div class="mini">${desenharBicho(i, t.marcas[k] === "nao" ? "triste" : "feliz")}<i class="marca ${t.marcas[k]}">${simbolo[t.marcas[k]]}</i></div>`).join("")}</div>`;
      }
      // Desafio: as dicas vêm juntas, sem dizer de qual bichinho é cada uma
      const ordenadas = [...t.marcas].sort((a, b) => ["certo", "quase", "nao"].indexOf(a) - ["certo", "quase", "nao"].indexOf(b))
        .filter(m => m !== "nao");
      return `<div class="tentativa"><span class="n">${numero}</span>${t.palpite.map(i =>
        `<div class="mini">${desenharBicho(i)}</div>`).join("")}
        <div class="resumo">${ordenadas.map(m => `<i class="marca ${m}">${simbolo[m]}</i>`).join("") || `<i class="marca nao">✕</i>`}</div></div>`;
    }).join("");
  }
}

/* ---------- Fim de jogo ---------- */
function ganhar() {
  jogo.fim = true;
  desenhar();
  revelar();
  SONS.ganhar();
  soltarConfete();
  const n = jogo.historico.length;
  const estrelas = n <= 4 ? 3 : n <= 7 ? 2 : 1;
  falar("Achou todo mundo!");
  setTimeout(() => mostrarFim("Você achou!",
    `Descobriu em ${n} ${n === 1 ? "tentativa" : "tentativas"}.`, estrelas), 900);
}

function perder() {
  jogo.fim = true;
  desenhar();
  revelar();
  SONS.perder();
  falar("As tentativas acabaram. Olha quem estava escondido!");
  setTimeout(() => mostrarFim("Quase!", "Veja no jardim quem estava escondido e tente de novo.", 0), 1300);
}

function mostrarFim(titulo, texto, estrelas) {
  const el = document.createElement("div");
  el.className = "fim";
  el.innerHTML = `<div class="adesivo" role="dialog" aria-label="${titulo}">
    <h2>${titulo}</h2>
    ${estrelas ? `<div class="estrelas">${[1, 2, 3].map(k => `<span class="${k <= estrelas ? "on" : "off"}">★</span>`).join("")}</div>` : ""}
    <p>${texto}</p>
    <div style="display:grid;gap:10px">
      <button class="btn novo" id="deNovo">Jogar de novo</button>
      <button class="btn" id="verJardim">Ver o jardim</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  $("deNovo").onclick = () => novoJogo();
  $("verJardim").onclick = () => {
    el.remove();
    $("apagar").textContent = "Novo jogo";
    $("apagar").disabled = false;
    $("apagar").onclick = () => { restaurarApagar(); novoJogo(); };
  };
  $("deNovo").focus();
}

function restaurarApagar() {
  $("apagar").textContent = "Apagar";
  $("apagar").onclick = () => tirar(jogo.palpite.length - 1);
}

/* ---------- Confete ---------- */
function soltarConfete() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const tela = $("confete"), ctx = tela.getContext("2d");
  tela.width = innerWidth; tela.height = innerHeight;
  const cores = BICHOS.map(b => b.cor);
  const pedacos = Array.from({ length: 140 }, () => ({
    x: Math.random() * tela.width, y: -20 - Math.random() * tela.height * .5,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4,
    giro: Math.random() * 6, vg: (Math.random() - .5) * .3,
    cor: cores[Math.floor(Math.random() * cores.length)], t: 6 + Math.random() * 6,
  }));
  let quadros = 0;
  (function animar() {
    ctx.clearRect(0, 0, tela.width, tela.height);
    for (const p of pedacos) {
      p.x += p.vx; p.y += p.vy; p.vy += .05; p.giro += p.vg;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.giro);
      ctx.fillStyle = p.cor; ctx.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2);
      ctx.restore();
    }
    if (++quadros < 220) requestAnimationFrame(animar);
    else ctx.clearRect(0, 0, tela.width, tela.height);
  })();
}

/* ---------- Botões e teclado ---------- */
restaurarApagar();
$("testar").onclick = testar;
document.querySelectorAll(".modos .chip").forEach(b => b.onclick = () => { restaurarApagar(); novoJogo(b.dataset.modo); });
$("som").onclick = () => {
  somLigado = !somLigado;
  $("som").setAttribute("aria-pressed", somLigado);
  $("som").textContent = "Som: " + (somLigado ? "ligado" : "desligado");
};
document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "6") colocar(+e.key - 1);
  else if (e.key === "Backspace") tirar(jogo.palpite.length - 1);
  else if (e.key === "Enter" && !document.activeElement.matches("button")) testar();
});

let modoSalvo = "facil";
try { modoSalvo = localStorage.getItem("escondeBichoModo") || "facil"; } catch {}
novoJogo(MODOS[modoSalvo] ? modoSalvo : "facil");
</script>
